name: Publish to JSR

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: denoland/setup-deno@v2.0.3
        with:
          deno-version: 2.9.7
      - run: deno task check
      - run: deno publish
