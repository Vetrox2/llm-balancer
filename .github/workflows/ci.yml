name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: denoland/setup-deno@v2.0.3
        with:
          deno-version: 2.9.7
      - run: deno task check
      - run: deno publish --dry-run
